# PostgreSQL service for Games.
# The host port is configured through DB_HOST_PORT.
name: games
services:
  games-db:
    image: postgres:16
    container_name: games-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: games
      POSTGRES_USER: games
      POSTGRES_PASSWORD: ${DB_PASSWORD:-games}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - games_pgdata:/var/lib/postgresql/data
    networks:
      - games-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U games -d games"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
volumes:
  games_pgdata:
networks:
  games-net:
