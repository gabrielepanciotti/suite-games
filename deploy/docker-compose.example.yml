# Public example only. Copy values from .env.example into .env before running.
services:
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      target: dev
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://games:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/games
    ports:
      - "10048:10048"
    volumes:
      - ../backend:/app/backend
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      target: dev
    environment:
      VITE_BACKEND_PROXY_TARGET: http://backend:10048
    ports:
      - "3382:3382"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: games
      POSTGRES_USER: games
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U games -d games"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - games_pgdata:/var/lib/postgresql/data

volumes:
  games_pgdata:
