name: games
services:
  games-backend:
    image: games-backend:dev
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      target: dev
    container_name: games-backend
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: "postgresql+asyncpg://games:${DB_PASSWORD:?set in .env}@games-db:5432/games"
    ports:
      - "10048:10048"
    volumes:
      - ../backend:/app/backend
    networks:
      - games-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:10048/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  games-frontend:
    image: games-frontend:dev
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      target: dev
    container_name: games-frontend
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      VITE_BACKEND_PROXY_TARGET: "http://games-backend:10048"
    ports:
      - "3382:3382"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      games-backend:
        condition: service_healthy
    networks:
      - games-net
networks:
  games-net:
